[package]
name = "horizon-bedrock"
version = "0.1.0"
edition = "2024"

[dependencies]
aws-lc-rs = "1.19"
base64ct = { version = "1.8", features = ["alloc"] }
getrandom = "0.3"
miniz_oxide = "0.9.1"
p384 = { version = "0.14", features = ["ecdsa", "pkcs8"] }
serde_json = "1.0.154"
str0m = { version = "0.25.0", default-features = false, features = ["rust-crypto"] }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "io-util", "time"] }
tokio-raknet = "0.2.0"
ureq = { version = "3.5.1", default-features = false, features = ["rustls"] }
